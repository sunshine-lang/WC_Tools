{% extends "base.html" %}

{% block title %}在线数据库词条检索{% endblock %}

{% block content %}
<div class="instructions">
    <strong>功能说明：</strong>
    <p>上传包含中文原文（待翻译内容）的 CSV 文件，系统将自动前往 RO 游戏数据库网站进行爬虫检索，为您寻找并精准匹配出对应的官方英文词条。</p>
    <br>
    <strong>使用规则：</strong>
    <ul>
        <li>请上传 <code>CSV (.csv)</code> 格式的文件。</li>
        <li>CSV 文件中必须包含 <code>cn</code> 列（作为待检索的中文原文）。</li>
    </ul>
</div>

<div style="margin-bottom: 24px; padding: 16px; background-color: #f8fafc; border-radius: 8px; border: 1px solid var(--border-color);">
    <label for="search-type" style="font-weight: 600; color: #0f172a; margin-right: 12px;">请选择爬取检索类型：</label>
    <select id="search-type" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background-color: #fff; cursor: pointer; outline: none;">
        <option value="item">物品 (Item/Equipment)</option>
        <option value="card">卡片 (Card)</option>
        <option value="monster">怪物 (Monster)</option>
        <option value="map">地图 (Map)</option>
        <option value="skill">技能 (Skill)</option>
    </select>
</div>

<div class="upload-grid">
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <p id="file-name">点击选择待处理的 CSV 文件</p>
    </div>
    <input type="file" id="file-input" accept=".csv" style="display:none;" onchange="updateFileInput('file-input', 'file-name', '点击选择待处理的 CSV 文件')">
</div>

<button class="upload-btn" id="start-btn" onclick="submitForm('/upload/skill', [{id: 'file-input', param: 'file', type: 'file'}, {id: 'search-type', param: 'search_type', type: 'value'}], 'start-btn')">
    开始爬虫检索匹配
</button>

<div class="progress-container" id="progress-container">
    <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="status-text" id="status-text">准备处理...</div>
    <button class="upload-btn" id="download-btn">下载处理结果</button>
</div>
{% endblock %}
