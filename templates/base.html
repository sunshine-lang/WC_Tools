<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC 辅助工具箱</title>
    <!-- 全局 CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 页面专属 CSS 插槽 -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">WC 辅助工具</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_page == 'key_classifier' %}active{% endif %}">
                <a href="/key_classifier">
                    <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    译文自动分类
                </a>
            </li>
            <li class="nav-item {% if active_page == 'context' %}active{% endif %}">
                <a href="/context">
                    <!-- 使用了一个链接符号的图标 -->
                    <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                    译文上下文关联
                </a>
            </li>
            <li class="nav-item {% if active_page == 'term' %}active{% endif %}">
                <a href="/term">
                    <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                    英德术语关联
                </a>
            </li>
            <li class="nav-item {% if active_page == 'term_filter' %}active{% endif %}">
                <a href="/term_filter">
                <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    英德术语语境筛选
                </a>
            </li>
            
            <li class="nav-item {% if active_page == 'tm' %}active{% endif %}">
                <a href="/tm">
                    <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M21 3H3c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.11-.9-2-2-2zm0 14H3V5h18v12zM5 10h14v2H5zm0-3h14v2H5zm0 6h14v2H5z"/></svg>
                    英德翻译记忆匹配
                </a>
            </li>
            <li class="nav-item {% if active_page == 'tag_clean' %}active{% endif %}">
                <a href="/tag_clean">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="margin-right: 12px; fill: currentColor;"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6z"/></svg>
                    标签空格清洗
                </a>
            </li>
            <li class="nav-item {% if active_page == 'qa' %}active{% endif %}">
                <a href="/qa">
                    <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 12px; fill: currentColor;"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    译后质量检查
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <p>Version 2.0.0</p>
        </div>
    </div>
    <div class="main-wrapper">
        <div class="topbar">
            <h2>{% block title %}{% endblock %}</h2>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>管理员</span>
            </div>
        </div>
        <div class="content">
            <div class="card fade-in">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- 全局 JS -->
    <script src="/static/js/main.js"></script>
    <!-- 页面专属 JS 插槽 -->
    {% block extra_js %}{% endblock %}
</body>
</html>
