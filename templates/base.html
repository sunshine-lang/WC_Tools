<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC 翻译工作台</title>
    <!-- 全局 CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 页面专属 CSS 插槽 -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">WC 翻译工作台</div>
        <ul class="nav-list">
            <li class="nav-item"><a href="/pipeline">翻译准备工作台</a></li>
            <li class="nav-item {% if active_page == 'tag_clean' %}active{% endif %}"><a href="/tag_clean">标签空格清洗</a></li>
            <li class="nav-item {% if active_page == 'qa' %}active{% endif %}"><a href="/qa">译后质量检查</a></li>
        </ul>
        <div class="sidebar-footer">
            <p>WC · en → de</p>
        </div>
    </div>
    <div class="main-wrapper">
        <div class="topbar">
            <h2>{% block title %}{% endblock %}</h2>
        </div>
        <div class="content">
            <div class="card fade-in">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- 页面专属 JS 插槽 -->
    {% block extra_js %}{% endblock %}
</body>
</html>
